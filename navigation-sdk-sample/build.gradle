plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin.android
    alias libs.plugins.kapt
}

android {
    namespace 'com.ola.maps.sample'
    compileSdk 35

    defaultConfig {
        applicationId "com.ola.maps.sample"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.217"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {
    //OlaMap SDK
    implementation(files("libs/OlaMapNavigationSDK-1.0.217.aar"))

    //Required for OlaMap SDK
    implementation "org.maplibre.gl:android-sdk:11.13.1"
    implementation "org.maplibre.gl:android-sdk-directions-models:5.9.0"
    implementation "org.maplibre.gl:android-sdk-services:5.9.0"
    implementation "org.maplibre.gl:android-sdk-turf:5.9.0"
    implementation "org.maplibre.gl:android-plugin-markerview-v9:3.0.2"
    implementation "org.maplibre.gl:android-plugin-annotation-v9:3.0.2"
    implementation "com.moengage:moe-android-sdk:14.02.02"

    // Used in sample app
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.5.1"
    implementation "com.google.android.material:material:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-extensions:2.0.0"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:2.0.0"
}
